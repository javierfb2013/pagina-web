<!DOCTYPE html>
    <!-- Esto le dice al navegador que es una página web -->
    <html>

    <!-- HEAD: información de la página (no se ve en pantalla) -->
    <head>
    <meta charset="UTF-8">
    <!-- Esto hace que la página se vea bien en el teléfono -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página web de Javier</title> <!-- Nombre que sale en la pestaña -->
      <!-- Estilos solo para teléfonos (pantallas de menos de 800px de ancho) -->
      <style>
        @media (max-width: 800px) {
          body { font-size: 26px; }
          input, button { font-size: 24px; padding: 10px; }
        }
      </style>
    </head>

    <!-- BODY: todo lo que SÍ se ve en la página -->
   <body style="text-align:center;">

      <!-- Links de paginas-->
    <div style="display:flex; gap: 10px; justify-content:center; flex-wrap:wrap; background-color:#121212; padding:10px;">
      <a style="color:white;" href="index.html">Home</a>
      <a style="color:red;" href="segunda-pagina.html">Segunda pagina</a>
      <a style="color:white;" href="tercera-pagina.html">Tercera pagina</a>
      <a style="color:white;" href="cuarta-pagina.html">Cuarta pagina</a>
      <a style="color:white;" href="tarea.html">Tarea</a>



      
    </div>

    <!-- Un título grande -->
    <h1 style="color:green;">Segunda pagina</h1>

    </br>
    </br>



    <!-- La caja de texto (el "id" es su nombre para encontrarla) -->
    <input type="text" id="nombre" placeholder="Dime tu nombre">

    <!-- El botón llama a la función saludar() al hacer clic -->
    <button onclick="saludar()">Saludar</button>
    <br>
    <br>
    
    


    <script>
  	  function saludar() {

   	 	// Buscamos la caja por su id y tomamos lo que se escribió
      let texto = document.getElementById("nombre").value;

      if(texto == "javier" || texto == "Javier" || texto == "Antonio" || texto == "antonio"){
        alert("Ese soy yo");
      }else{
        // Mostramos el valor en una ventanita
        alert("¡Hola, " + texto + " Buenos Dias");
      }

  	 }
    </script>





   </body>
</html>
