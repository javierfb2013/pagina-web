<!DOCTYPE html>
<!-- Esto le dice al navegador que es una página web -->
<html>

  <!-- HEAD: información de la página (no se ve en pantalla) -->
  <head>
    <meta charset="UTF-8">
    <!-- Esto hace que la página se vea bien en el teléfono -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Página web de Javier</title> <!-- Nombre que sale en la pestaña -->
  </head>

  <!-- BODY: todo lo que SÍ se ve en la página -->
  <body style="text-align:center;">

    <div style="display:flex; gap: 10px; justify-content:center; flex-wrap:wrap; background-color:#121212; padding:10px;">
      <!-- Links de paginas-->
      <a style="color:red;" href="index.html">Home</a> 
      <a style="color:white;" href="segunda-pagina.html">Segunda pagina</a>
      <a style="color:white;" href="tercera-pagina.html">Tercera pagina</a>
      <a style="color:white;" href="cuarta-pagina.html">Cuarta pagina</a>
    </div>

    <!-- Un título grande -->
    <h1 id="titulo" style="color:green;">Home</h1>

    

    <br>
    <br>

    <!-- Este botón llama a la función ocultarTitulo() al hacer clic -->
    <button onclick="ocultarYmostrarTitulo()">Ocultar y mostrar título</button>

    <br>
    <br>

    <!-- La caja de texto (el "id" es su nombre para encontrarla) -->
    <input type="text" id="nombre" placeholder="Escribe tu nombre">

    <!-- El botón llama a la función Enviar() al hacer clic -->
    <button onclick="enviar()">Enviar</button>

    <br>
    <br>

   

      <script>
  	function enviar() {

      // Buscamos la caja por su id y tomamos lo que se escribió
      let texto = document.getElementById("nombre").value;

      if(texto == "javier" || texto == "Javier" || texto == "Antonio" || texto == "antonio"){
      alert("Ese soy yo");
      }else{
        // Mostramos el valor en una ventanita
        alert("¡Hola, " + texto + " Buenos Dias");
      }

  	}

    function ocultarTitulo() {
      // Buscamos el título por su id y lo escondemos
      document.getElementById("titulo").style.display = "none";
    }

      function ocultarYmostrarTitulo(){

        let titulo = document.getElementById("titulo"); 

        if(titulo.style.display == "none"){
          titulo.style.display = "block"
        }else{
          titulo.style.display = "none"
        }
         
      }

   </script>
   
  </body>
</html>
