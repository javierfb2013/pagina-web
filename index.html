<!DOCTYPE html>
<!-- Esto le dice al navegador que es una página web -->
<html>

  <!-- HEAD: información de la página (no se ve en pantalla) -->
  <head>
    <meta charset="UTF-8">
    <title>Página web de Javier</title> <!-- Nombre que sale en la pestaña -->
  </head>

  <!-- BODY: todo lo que SÍ se ve en la página -->
  <body>

    <!-- Un título grande -->
    <h1 id="titulo" style="color:green;">¡Hola!</h1>

    <!-- Este botón llama a la función ocultarTitulo() al hacer clic -->
    <button onclick="ocultarTitulo()">Ocultar título</button>

    <!-- La caja de texto (el "id" es su nombre para encontrarla) -->
    <input type="text" id="nombre" placeholder="Escribe tu nombre">

    <!-- El botón llama a la función Enviar() al hacer clic -->
    <button onclick="enviar()">Enviar</button>


   <a href="segunda-pagina.html">Ve a la segunda pagina</a>


      <script>
  	function enviar() {

      // Buscamos la caja por su id y tomamos lo que se escribió
      let texto = document.getElementById("nombre").value;

      if(texto == "javier" || texto == "Javier" || texto == "Antonio" || texto == "antonio"){
      alert("Ese soy yo");
      }else{
        // Mostramos el valor en una ventanita
        alert("¡Hola, " + texto + " Buenos Dias");
      }

  	}

    function ocultarTitulo() {
      // Buscamos el título por su id y lo escondemos
      document.getElementById("titulo").style.display = "none";
    }
   </script>
   
  </body>
</html>
