 <!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <!-- Esto hace que la página se vea bien en el teléfono -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página web de Javier</title>
    <!-- Estilos solo para teléfonos (pantallas de menos de 800px de ancho) -->
    <style>
      @media (max-width: 800px) {
        body { font-size: 26px; }
        input, button { font-size: 24px; padding: 10px; }
      }
    </style>
  </head>

  <body style="text-align:center;">

    <div style="display:flex; gap: 10px; justify-content:center; flex-wrap:wrap; background-color:#121212; padding:10px;">
      <!-- Links de paginas-->
      <a style="color:white;" href="index.html">Home</a>
      <a style="color:white;" href="segunda-pagina.html">Segunda pagina</a>
      <a style="color:white;" href="tercera-pagina.html">Tercera pagina</a>
      <a style="color:red;" href="cuarta-pagina.html">Cuarta pagina</a>
      <a style="color:white;" href="tarea.html">Tarea</a>



      

    </div>

    <!-- Un título grande -->
    <h1 id="titulo" style="color:green;">Cuarta pagina</h1>

    <!-- Botón que cambia el color del título -->
    <button onclick="cambiarColor()">Cambiar color</button>

    <!-- Botón que activa y desactiva el modo oscuro -->
    <button onclick="modoOscuro()">Modo oscuro</button>



    <!-- La caja de texto (el "id" es su nombre para encontrarla) -->
    <input type="text" id="nombre" placeholder="Contraseña">



    <!-- El botón llama a la función Enviar() al hacer clic -->
    <button onclick="enviar()">Enviar</button>




    <script>

     function enviar() {

        // Buscamos la caja por su id y tomamos lo que se escribió
        let texto = document.getElementById("nombre").value;

        if(texto == "tato123"){
        alert("Bienvenido agente secreto");
       }else{
        // Mostramos el valor en una ventanita
        alert("Contraseña Incorrecta");
       }
      }


      function modoOscuro() {
        var cuerpo = document.body;
        // Si el fondo está negro, volvemos a blanco; si no, lo ponemos negro
        if (cuerpo.style.backgroundColor === "black") {
          cuerpo.style.backgroundColor = "white";
          cuerpo.style.color = "black";
        } else {
          cuerpo.style.backgroundColor = "black";
          cuerpo.style.color = "white";
        }
      }


      function cambiarColor() {
        var titulo = document.getElementById("titulo");
        // Si está verde, lo ponemos azul; si no, vuelve a verde
        if (titulo.style.color === "green") {
          titulo.style.color = "blue";
        } else {
          titulo.style.color = "green";
        }
      }

    














    </script>




    
                     <!--Una foto bonita uwu-->
    <img id="foto" src="foto.jpg" alt="Una foto bonita" width="400" style="max-width:100%; height:auto;">




    <h3>A mi me gusta la pizza, me gusta jugar videojuegos y me gusta comer y dormir.</h3>





  </body>


</html>
